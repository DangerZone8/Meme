name: Windows app CI and installer

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "feature/**", "fix/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installable app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.10,<7"

      - name: Check Python syntax
        run: |
          python -m py_compile its_giving.py its_giving_v2.py scripts/verify_windows_package.py

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Validate Vercel website and download route
        shell: pwsh
        run: |
          if (!(Test-Path "index.html")) { throw "Vercel landing page index.html is missing." }
          if (!(Test-Path "vercel.json")) { throw "Vercel configuration vercel.json is missing." }
          $config = Get-Content "vercel.json" -Raw | ConvertFrom-Json
          if ($config.rewrites.Count -lt 1 -or $config.rewrites[0].source -ne "/download" -or $config.rewrites[0].destination -ne "/api/download") { throw "Vercel /download must route through the website's /api/download handler." }
          if (!(Test-Path "api/download.js")) { throw "Vercel download proxy api/download.js is missing." }
          if (!(Test-Path "scripts/publish_vercel_installer.mjs")) { throw "Vercel Blob upload script is missing." }
          $page = Get-Content "index.html" -Raw
          if ($page -notmatch 'href="/download"') { throw "Landing page does not link to /download." }
          Write-Output "PASS: Vercel landing page, same-domain download route, and Blob uploader are configured."

      - name: Build distributable application folder
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --name ItsGiving --collect-all mediapipe --collect-all cv2 --collect-all numpy --collect-all PIL --hidden-import pyvirtualcam --add-data "assets;assets" its_giving_v2.py
          if (!(Test-Path "dist/ItsGiving/ItsGiving.exe")) { throw "Packaged executable was not created." }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Prepare installer output directory
        run: New-Item -ItemType Directory -Force -Path dist/installer | Out-Null

      - name: Build Windows installer
        run: iscc installer/its_giving.iss

      - name: Install app silently for verification
        shell: pwsh
        run: |
          $installer = (Resolve-Path "dist/installer/ItsGiving-Setup.exe").Path
          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent installer exited with code $($process.ExitCode)." }
          $installedExe = Join-Path $env:LOCALAPPDATA "Programs/ItsGiving/ItsGiving.exe"
          if (!(Test-Path $installedExe)) { throw "Installer completed but installed executable was not found at $installedExe" }

      - name: Verify packaged, installed app and installer
        shell: pwsh
        run: |
          python scripts/verify_windows_package.py --app-dir dist/ItsGiving --installer dist/installer/ItsGiving-Setup.exe --installed-dir "$env:LOCALAPPDATA/Programs/ItsGiving"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ItsGiving-Windows-Installer
          path: dist/installer/ItsGiving-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Set up Node for Vercel Blob upload
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish installer to Vercel Blob
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BLOB_READ_WRITE_TOKEN)) { throw "Add BLOB_READ_WRITE_TOKEN to GitHub Actions secrets and connect a Vercel Blob store before publishing." }
          npm install --no-package-lock --ignore-scripts
          $output = node scripts/publish_vercel_installer.mjs dist/installer/ItsGiving-Setup.exe
          $output | Write-Output
          $line = $output | Where-Object { $_ -like "VERCEL_INSTALLER_URL=*" } | Select-Object -Last 1
          if (!$line) { throw "Vercel Blob uploader did not return an installer URL." }
          "vercel_installer_url=$($line.Substring('VERCEL_INSTALLER_URL='.Length))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

