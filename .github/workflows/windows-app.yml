name: Windows app CI and private test build

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build and verify Windows test installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.10,<7"
      - name: Check Python syntax
        run: python -m py_compile its_giving.py its_giving_v2.py scripts/verify_windows_package.py
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Validate website download route
        shell: pwsh
        run: |
          if (!(Test-Path "index.html")) { throw "Landing page index.html is missing." }
          if (!(Test-Path "vercel.json")) { throw "Vercel config vercel.json is missing." }
          $config = Get-Content "vercel.json" -Raw | ConvertFrom-Json
          if ($config.rewrites.Count -lt 1 -or $config.rewrites[0].source -ne "/download" -or $config.rewrites[0].destination -ne "/api/download") { throw "Vercel /download must route to /api/download." }
          if (!(Test-Path "api/download.js")) { throw "Download proxy api/download.js is missing." }
          $page = Get-Content "index.html" -Raw
          if ($page -notmatch 'href="/download"') { throw "Landing page does not link to /download." }
          Write-Output "PASS: website download route configuration."
      - name: Build distributable application folder
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --name ItsGiving --collect-all mediapipe --collect-all cv2 --collect-all numpy --collect-all PIL --hidden-import pyvirtualcam --add-data "assets;assets" its_giving_v2.py
          if (!(Test-Path "dist/ItsGiving/ItsGiving.exe")) { throw "Packaged executable was not created." }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Prepare installer output directory
        run: New-Item -ItemType Directory -Force -Path dist/installer | Out-Null
      - name: Build Windows installer
        run: iscc installer/its_giving.iss
      - name: Install app silently for verification
        shell: pwsh
        run: |
          $installer = (Resolve-Path "dist/installer/ItsGiving-Setup.exe").Path
          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent installer exited with code $($process.ExitCode)." }
          $installedExe = Join-Path $env:LOCALAPPDATA "Programs/ItsGiving/ItsGiving.exe"
          if (!(Test-Path $installedExe)) { throw "Installed executable missing at $installedExe" }
      - name: Verify packaged app, installation and installer
        shell: pwsh
        run: python scripts/verify_windows_package.py --app-dir dist/ItsGiving --installer dist/installer/ItsGiving-Setup.exe --installed-dir "$env:LOCALAPPDATA/Programs/ItsGiving"
      - name: Upload versioned test installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ItsGiving-Test-v0.1.0-Windows
          path: dist/installer/ItsGiving-Setup.exe
          if-no-files-found: error
          retention-days: 7
