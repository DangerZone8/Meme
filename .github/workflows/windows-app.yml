name: Windows portable app CI

# Do not cancel a running Windows build when another push lands on this branch.
# Queue the newer run instead so a packaging check cannot silently disappear.
concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  windows:
    name: Build and smoke-test portable Windows app
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js for Electron checks
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check Electron JavaScript syntax and download endpoint tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/renderer.js
          node --check api/download.js
          node --check scripts/publish_vercel_app.mjs
          node --test tools/test_download_endpoint.mjs
          node -e "JSON.parse(require('fs').readFileSync('desktop/package.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: engine/requirements.txt
      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements.txt
          python -m pip install "pyinstaller>=6.10,<7"
      - name: Test Electron desktop contract
        run: python -m unittest tools.test_desktop_contract -v
      - name: Install OBS Studio for virtual camera verification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $obsExe = Join-Path $env:ProgramFiles "obs-studio/bin/64bit/obs64.exe"
          if (!(Test-Path $obsExe)) {
            winget install --id OBSProject.OBSStudio --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          }
          if (!(Test-Path $obsExe)) { throw "OBS Studio installation did not provide obs64.exe." }
          $obsRoot = Join-Path $env:ProgramFiles "obs-studio"
          $virtualCamInstaller = Join-Path $obsRoot "data/obs-plugins/win-dshow/virtualcam-install.bat"
          if (Test-Path $virtualCamInstaller) {
            & $virtualCamInstaller
            if ($LASTEXITCODE -ne 0) { throw "OBS Virtual Camera driver registration failed with exit code $LASTEXITCODE." }
            Write-Host "Legacy OBS Virtual Camera registration script completed."
          } else {
            Write-Host "This OBS package does not include the legacy registration script. The following pyvirtualcam smoke test is the authoritative device-availability check."
          }
      - name: Test OBS Virtual Camera output (synthetic 640x480 stream)
        run: python tools/test_obs_virtual_camera.py --width 640 --height 480 --fps 30 --frames 90
      - name: Check Python syntax
        run: python -m py_compile its_giving.py its_giving_v2.py tools/test_face_replacement.py tools/test_obs_virtual_camera.py tools/test_desktop_contract.py scripts/verify_windows_package.py
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Test full-face meme replacement
        run: python -m unittest tools.test_face_replacement -v
      - name: Bundle MediaPipe models
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path models | Out-Null
          $models = @{
            "face_landmarker.task" = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
            "hand_landmarker.task" = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
            "pose_landmarker_lite.task" = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"
          }
          foreach ($entry in $models.GetEnumerator()) {
            Invoke-WebRequest -Uri $entry.Value -OutFile (Join-Path "models" $entry.Key)
            if ((Get-Item (Join-Path "models" $entry.Key)).Length -lt 100000) { throw "Incomplete model: $($entry.Key)" }
          }
      - name: Build standalone Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pyinstaller --noconfirm --clean --onefile --windowed --name ItsGiving --collect-all mediapipe --collect-all cv2 --collect-all numpy --collect-all PIL --hidden-import pyvirtualcam --add-data "assets;assets" --add-data "models;models" its_giving_v2.py
          if (!(Test-Path "dist/ItsGiving.exe")) { throw "Portable app executable was not created." }
          if ((Get-Item "dist/ItsGiving.exe").Length -lt 50000000) { throw "Portable executable is unexpectedly small; dependencies may be missing." }
      - name: Verify portable Python engine (x64, SHA-256, launch)
        run: python tools/verify_portable_app.py dist/ItsGiving.exe --smoke-test
      - name: Package Python engine into Electron desktop app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path desktop/resources | Out-Null
          Copy-Item dist/ItsGiving.exe desktop/resources/ItsGiving.exe -Force
          Push-Location desktop
          try {
            npm install --no-audit --no-fund
            npm run dist:win
          } finally { Pop-Location }
          $desktopExe = Get-Item "desktop/dist/ItsGiving-Desktop-0.3.0-Windows.exe"
          if (!$desktopExe) { throw "Electron portable executable was not created." }
          # electron-builder's portable target uses an x86 NSIS bootstrapper
          # even when the unpacked Electron application is x64.
          python tools/verify_portable_app.py $desktopExe.FullName --allow-x86
          # Verify the actual Electron app and the Python engine embedded in it
          # are both x64; do not mistake the bootstrapper's architecture for the app's.
          python tools/verify_portable_app.py desktop/dist/win-unpacked/ItsGiving.exe
          python tools/verify_portable_app.py desktop/dist/win-unpacked/resources/ItsGiving.exe
          $sourceHash = (Get-FileHash dist/ItsGiving.exe -Algorithm SHA256).Hash
          $bundledHash = (Get-FileHash desktop/dist/win-unpacked/resources/ItsGiving.exe -Algorithm SHA256).Hash
          if ($sourceHash -ne $bundledHash) { throw "Bundled Python engine does not match the verified source executable." }
      - name: Upload portable Python engine
        uses: actions/upload-artifact@v5
        with:
          name: ItsGiving-Engine-Windows-v0.3.0
          path: dist/ItsGiving.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload portable Electron desktop app
        uses: actions/upload-artifact@v5
        with:
          name: ItsGiving-Electron-Portable-Windows-v0.3.0
          path: desktop/dist/ItsGiving-Desktop-0.3.0-Windows.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Prepare reviewed website download PR (no Vercel secrets)
    needs: windows
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download verified portable Electron app
        uses: actions/download-artifact@v5
        with:
          name: ItsGiving-Electron-Portable-Windows-v0.3.0
          path: downloaded
      - name: Create a reviewed PR containing the static download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          file="downloaded/ItsGiving-Desktop-0.3.0-Windows.exe"
          test -s "$file"
          bytes="$(stat -c '%s' "$file")"
          max_bytes=$((95 * 1024 * 1024))
          if [ "$bytes" -gt "$max_bytes" ]; then
            echo "::error::The portable app is $bytes bytes; the secretless Git-backed download supports files up to 95 MiB. Reduce the packaged app size before publishing."
            exit 1
          fi
          mkdir -p public/downloads
          cp "$file" public/downloads/ItsGiving.exe
          branch="automated/windows-download-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add public/downloads/ItsGiving.exe
          git commit -m "Publish verified Windows portable app"
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" --title "Publish Windows portable app download" --body "Automated publication from Windows CI run $GITHUB_RUN_ID. The executable was built and smoke-tested by the Windows job. Merge this PR to publish it as a static Vercel asset. No Vercel secrets or Blob storage are used."
          # GITHUB_TOKEN-created PRs do not automatically trigger pull_request
          # workflows. Explicitly dispatch this workflow on the PR branch so
          # the exact commit receives a fresh Windows build/test run.
          gh workflow run windows-app.yml --ref "$branch"
